<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#173f2a" />
  <title>Discgolf Score</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">MIN BANA</p>
        <h1>Discgolf Score</h1>
      </div>
      <button id="historyBtn" class="icon-btn" aria-label="Visa historik">Historik</button>
    </header>

    <section id="setupView" class="view active">
      <div class="card">
        <h2>Starta runda</h2>
        <label>
          Banans namn
          <input id="courseName" value="Hemmabanan" maxlength="40" />
        </label>
        <div class="grid-2">
          <label>
            Antal hål
            <select id="holeCount">
              <option value="6">6</option>
              <option value="9" selected>9</option>
              <option value="12">12</option>
              <option value="18">18</option>
            </select>
          </label>
          <label>
            Standardpar
            <select id="defaultPar">
              <option value="3" selected>Par 3</option>
              <option value="4">Par 4</option>
              <option value="5">Par 5</option>
            </select>
          </label>
        </div>
      </div>

      <div class="card">
        <div class="section-row">
          <h2>Spelare</h2>
          <button id="addPlayerBtn" class="secondary-btn">+ Lägg till</button>
        </div>
        <div id="playersSetup" class="players-setup"></div>
      </div>

      <button id="startRoundBtn" class="primary-btn full">Starta rundan</button>
    </section>

    <section id="roundView" class="view">
      <div class="round-head card compact">
        <div>
          <p id="roundCourse" class="eyebrow"></p>
          <h2 id="holeTitle">Hål 1</h2>
        </div>
        <div class="par-control">
          <span>Par</span>
          <button id="parMinus" aria-label="Sänk par">−</button>
          <strong id="parValue">3</strong>
          <button id="parPlus" aria-label="Höj par">+</button>
        </div>
      </div>

      <div id="scoreCards" class="score-cards"></div>

      <div class="round-nav">
        <button id="prevHoleBtn" class="secondary-btn">← Föregående</button>
        <button id="nextHoleBtn" class="primary-btn">Nästa →</button>
      </div>
      <button id="finishRoundBtn" class="danger-link">Avsluta rundan</button>
    </section>

    <section id="resultView" class="view">
      <div class="card result-hero">
        <p class="eyebrow">RUNDAN KLAR</p>
        <h2 id="winnerText">Resultat</h2>
        <p id="resultMeta"></p>
      </div>
      <div id="leaderboard" class="leaderboard"></div>
      <div class="result-actions">
        <button id="newRoundBtn" class="primary-btn full">Ny runda</button>
        <button id="shareBtn" class="secondary-btn full">Dela resultat</button>
      </div>
    </section>

    <section id="historyView" class="view">
      <div class="section-row history-heading">
        <h2>Historik</h2>
        <button id="closeHistoryBtn" class="secondary-btn">Stäng</button>
      </div>
      <div id="historyList" class="history-list"></div>
      <button id="clearHistoryBtn" class="danger-link">Radera all historik</button>
    </section>
  </main>

  <template id="playerInputTemplate">
    <div class="player-input-row">
      <input class="player-name-input" maxlength="24" placeholder="Spelarens namn" />
      <button class="remove-player-btn" aria-label="Ta bort spelare">×</button>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
